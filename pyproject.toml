[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-agent"
version = "0.1.0"
description = "Local-first, teacher-controlled reasoning agent prototype for AI literacy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["httpx2", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
